name: ROOMLY backend verification

on:
  push:
    paths: ['backend/**', 'Infra/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'Infra/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: roomly_ci
          MYSQL_ROOT_PASSWORD: isolated-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      ROOMLY_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/roomly_ci?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      ROOMLY_TEST_MYSQL_USER: root
      ROOMLY_TEST_MYSQL_PASSWORD: isolated-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify ROOMLY unit, application and MySQL tests
        run: mvn -B -ntp verify
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomly-backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Infra
    env:
      ROOMLY_DATABASE: roomly_ci_docker
      ROOMLY_DB_USER: roomly_ci
      ROOMLY_DB_PASSWORD: isolated-container-app-password
      ROOMLY_MYSQL_ROOT_PASSWORD: isolated-container-root-password
      ROOMLY_HTTP_PORT: "0"
      ROOMLY_MYSQL_HOST_PORT: "0"
      ROOMLY_MAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Generate a signing key for this isolated run
        run: printf 'ROOMLY_JWT_SECRET=%s\n' "$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Start ROOMLY from a fresh MySQL volume
        run: docker compose -p roomly-ci --env-file roomly/.env.example up --build --wait --wait-timeout 180
      - name: Check database health after a MySQL restart
        run: |
          docker compose -p roomly-ci --env-file roomly/.env.example restart mysql
          api_endpoint="$(docker compose -p roomly-ci --env-file roomly/.env.example port backend 18092)"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 "http://$api_endpoint/actuator/health"
      - name: Show container logs
        if: always()
        run: docker compose -p roomly-ci --env-file roomly/.env.example logs --no-color --tail 100
      - name: Remove this run's containers and volumes
        if: always()
        run: docker compose -p roomly-ci --env-file roomly/.env.example down --volumes
