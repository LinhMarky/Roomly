spring.application.name=roomly
server.port=${ROOMLY_HTTP_PORT:${STUDENT14_HTTP_PORT:18092}}
server.address=${ROOMLY_BIND_ADDRESS:${STUDENT14_BIND_ADDRESS:127.0.0.1}}

# STUDENT14_* aliases preserve existing local database, media and signing settings.
spring.datasource.url=jdbc:mysql://${ROOMLY_DB_HOST:${STUDENT14_DB_HOST:127.0.0.1}}:${ROOMLY_DB_PORT:${STUDENT14_DB_PORT:3306}}/${ROOMLY_DATABASE:${STUDENT14_DATABASE:homely_student14}}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${ROOMLY_DB_SSL_MODE:${STUDENT14_DB_SSL_MODE:PREFERRED}}
spring.datasource.username=${ROOMLY_DB_USER:${STUDENT14_DB_USER:homely_student14}}
spring.datasource.password=${ROOMLY_DB_PASSWORD:${STUDENT14_DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
spring.task.scheduling.pool.size=4

roomly.jwt-secret=${ROOMLY_JWT_SECRET:${STUDENT14_JWT_SECRET:}}
roomly.media-directory=${ROOMLY_MEDIA_DIRECTORY:${STUDENT14_MEDIA_DIRECTORY:./Infra/student14/.local/media}}
roomly.mock-payment-enabled=${ROOMLY_MOCK_PAYMENT_ENABLED:${STUDENT14_MOCK_PAYMENT_ENABLED:true}}
roomly.mail-enabled=${ROOMLY_MAIL_ENABLED:${STUDENT14_MAIL_ENABLED:false}}
roomly.push-enabled=${ROOMLY_PUSH_ENABLED:${STUDENT14_PUSH_ENABLED:false}}
roomly.firebase-project-id=${ROOMLY_FIREBASE_PROJECT_ID:${STUDENT14_FIREBASE_PROJECT_ID:}}
roomly.firebase-credentials=${ROOMLY_FIREBASE_CREDENTIALS:${STUDENT14_FIREBASE_CREDENTIALS:}}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.auth.mechanisms=LOGIN
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
roomly.mail.from=${MAIL_FROM:noreply@roomly.local}

management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info
